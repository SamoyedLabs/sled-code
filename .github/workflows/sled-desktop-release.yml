name: Sled Desktop Release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "1-56/5 * * * *"
permissions:
  contents: read
concurrency:
  group: sled-desktop-release
  cancel-in-progress: false
jobs:
  resolve:
    if: >-
      github.repository == 'SamoyedLabs/sled-code' &&
      vars.SLED_DESKTOP_RELEASE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - id: resolve
        name: Select an unreleased main commit with successful Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sled/hosted-desktop-release.py resolve
  build:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: mac, arch: arm64, target: zip }
          - { runner: windows-2025, platform: win, arch: x64, target: nsis }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_PRIVATE_BUILD: "true"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: SamoyedLabs/sled-code
      SLED_DESKTOP_PORTABLE: "true"
      SLED_DESKTOP_AUTO_UPDATE: "true"
      SLED_WINDOWS_PUBLISHER_NAME: ${{ vars.SLED_WINDOWS_PUBLISHER_NAME }}
      SLED_APPLE_TEAM_ID: ${{ vars.SLED_APPLE_TEAM_ID }}
      SLED_MAC_DISTRIBUTION: ${{ vars.SLED_MAC_DISTRIBUTION || 'private-development' }}
      SLED_MAC_SIGNING_REQUIREMENT: ${{ vars.SLED_MAC_SIGNING_REQUIREMENT }}
      SLED_WINDOWS_TRUST_CERT: ${{ vars.SLED_WINDOWS_TRUST_CERT }}
      SLED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.SLED_WINDOWS_SIGNER_THUMBPRINT }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Require authorized signing configuration before building
        shell: bash
        env:
          CSC_LINK: ${{ secrets.SLED_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SLED_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.SLED_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.SLED_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.SLED_APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.SLED_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.SLED_WIN_CSC_KEY_PASSWORD }}
        run: python3 scripts/sled/hosted-desktop-release.py credentials --platform '${{ matrix.platform }}'
      - name: Resolve the Windows compiler cache
        id: msvc
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'Visual C++ tools are missing on the hosted image' }
          $toolset = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $compiler = Get-FileHash (Join-Path $toolset.FullName 'bin\Hostx64\x64\cl.exe') -Algorithm SHA256
          "path=$(Join-Path $toolset.FullName 'lib\spectre\x64')" >> $env:GITHUB_OUTPUT
          "key=msvc-spectre-x64-v1-$($toolset.Name)-$($compiler.Hash)" >> $env:GITHUB_OUTPUT
          "MSVC_INSTALL=$install" >> $env:GITHUB_ENV
      - name: Restore matching Windows Spectre libraries
        id: spectre
        if: matrix.platform == 'win'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.msvc.outputs.path }}
          key: ${{ steps.msvc.outputs.key }}
      - name: Ensure required Windows Spectre libraries
        id: installed_msvc
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = $env:MSVC_INSTALL
          $toolset = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!(Test-Path (Join-Path $toolset.FullName 'lib\spectre\x64\libcmt.lib'))) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $process = Start-Process -FilePath $setup -ArgumentList @('modify', '--installPath', "`"$install`"", '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio component installation failed: $($process.ExitCode)" }
          }
          # The installer may update MSVC; never save new libraries under the old compiler key.
          $toolset = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $libraryPath = Join-Path $toolset.FullName 'lib\spectre\x64'
          if (!(Test-Path (Join-Path $libraryPath 'libcmt.lib'))) { throw 'Required x64 Spectre libraries are still missing' }
          $compiler = Get-FileHash (Join-Path $toolset.FullName 'bin\Hostx64\x64\cl.exe') -Algorithm SHA256
          "path=$libraryPath" >> $env:GITHUB_OUTPUT
          "key=msvc-spectre-x64-v1-$($toolset.Name)-$($compiler.Hash)" >> $env:GITHUB_OUTPUT
      - name: Cache installed Windows Spectre libraries
        if: matrix.platform == 'win' && steps.spectre.outputs.cache-matched-key != steps.installed_msvc.outputs.key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.installed_msvc.outputs.path }}
          key: ${{ steps.installed_msvc.outputs.key }}
      - name: Select the native SDK used by CI
        if: matrix.platform == 'mac'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/monorepo --filter @t3tools/desktop... --filter @t3tools/web... --filter t3... --filter @t3tools/scripts...
          restore-full-store: "false"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve native build cache identity
        id: native-cache
        shell: bash
        run: |
          rustc -vV > "$RUNNER_TEMP/rust-toolchain.txt"
          echo "rust=$(git hash-object "$RUNNER_TEMP/rust-toolchain.txt")" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == macOS ]]; then
            { xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; swift --version; } > "$RUNNER_TEMP/swift-toolchain.txt"
            echo "swift=$(git hash-object "$RUNNER_TEMP/swift-toolchain.txt")" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache resource monitor compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target
          key: sled-resource-monitor-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.rust }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
          restore-keys: |
            sled-resource-monitor-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.rust }}-
      - name: Cache Mac host compilation
        if: matrix.platform == 'mac'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/remote-desktop/.build
          key: sled-mac-host-v1-${{ runner.arch }}-${{ steps.native-cache.outputs.swift }}-${{ hashFiles('native/remote-desktop/Package.*', 'native/remote-desktop/Sources/**', 'third-party/webrtc/manifest.json') }}
          restore-keys: |
            sled-mac-host-v1-${{ runner.arch }}-${{ steps.native-cache.outputs.swift }}-
      - name: Select Electron download caches
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder" >> "$GITHUB_ENV"
      - name: Cache Electron and packaging tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: sled-electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            sled-electron-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reuse the pinned WebRTC binary from CI
        if: matrix.platform == 'mac'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tools/webrtc/*.zip
          key: webrtc-archive-macos-v1-${{ hashFiles('third-party/webrtc/manifest.json') }}
      - name: Prepare and sign the Mac native host
        if: matrix.platform == 'mac'
        run: |
          python3 scripts/sled/prepare-native.py
          python3 scripts/build-host.py
      - name: Build desktop
        run: vp run build:desktop
      - name: Build signed final installer and updater metadata
        env:
          CSC_LINK: ${{ secrets.SLED_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SLED_MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.SLED_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.SLED_WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          signing=(--signed)
          if [[ '${{ matrix.platform }}' == 'mac' && "$SLED_MAC_DISTRIBUTION" == 'private-development' ]]; then
            signing=()
          fi
          vp run dist:desktop:artifact --platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --arch '${{ matrix.arch }}' --build-version '${{ needs.resolve.outputs.version }}' "${signing[@]}" --skip-build --output-dir release-desktop
          if [[ '${{ matrix.platform }}' == 'mac' && "$SLED_MAC_DISTRIBUTION" == 'private-development' ]]; then
            node scripts/sign-private-desktop.cjs 'release-desktop/T3-Code-${{ needs.resolve.outputs.version }}-arm64.zip'
          fi
      - name: Finalize private metadata and verify signatures and update assets
        env:
          SLED_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/sled/verify-hosted-desktop.cjs '${{ matrix.platform }}' release-desktop
      - name: Retain uncertified Windows packages for diagnosis only
        if: failure() && matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: sled-diagnostics-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release-desktop/*.exe
            release-desktop/windows-signatures.json
      - uses: actions/upload-artifact@v4
        with:
          name: sled-desktop-${{ matrix.platform }}
          retention-days: 7
          compression-level: 0
          path: release-desktop/*
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sled-desktop-*
          path: release-desktop
          merge-multiple: true
      - name: Publish both certified platforms atomically from a draft
        env:
          GH_TOKEN: ${{ github.token }}
          SLED_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SLED_RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/sled/hosted-desktop-release.py publish
