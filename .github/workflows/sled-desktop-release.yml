name: Sled Desktop Release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build this ref on free runners without signing or publishing
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "1-56/5 * * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.verify_only && format('sled-desktop-verify-{0}', github.ref) || 'sled-desktop-release' }}
  cancel-in-progress: false
jobs:
  resolve:
    if: >-
      !inputs.verify_only &&
      github.repository == 'SamoyedLabs/sled-code' &&
      vars.SLED_DESKTOP_RELEASE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      timings: ${{ steps.timing.outputs.timings }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - id: resolve
        name: Select an unreleased main commit with successful Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sled/hosted-desktop-release.py resolve
      - name: Load recent GitHub step timings
        id: timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sled/ci_progress.py history --workflow sled-desktop-release.yml
  build:
    name: build (${{ matrix.runner }}, ${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: macos-15,
              platform: mac,
              arch: arm64,
              target: zip,
              rust: aarch64-apple-darwin,
            }
          - {
              runner: windows-2025,
              platform: win,
              arch: x64,
              target: nsis,
              rust: x86_64-pc-windows-msvc,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      CI_TIMING_BASELINE: ${{ needs.resolve.outputs.timings }}
      CI_TIMING_JOB: build (${{ matrix.runner }}, ${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.target }})
      T3CODE_DESKTOP_PRIVATE_BUILD: "true"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: SamoyedLabs/sled-code
      SLED_DESKTOP_PORTABLE: "true"
      SLED_DESKTOP_AUTO_UPDATE: "true"
      SLED_WINDOWS_PUBLISHER_NAME: ${{ vars.SLED_WINDOWS_PUBLISHER_NAME }}
      SLED_APPLE_TEAM_ID: ${{ vars.SLED_APPLE_TEAM_ID }}
      SLED_MAC_DISTRIBUTION: ${{ vars.SLED_MAC_DISTRIBUTION || 'private-development' }}
      SLED_MAC_SIGNING_REQUIREMENT: ${{ vars.SLED_MAC_SIGNING_REQUIREMENT }}
      SLED_WINDOWS_TRUST_CERT: ${{ vars.SLED_WINDOWS_TRUST_CERT }}
      SLED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.SLED_WINDOWS_SIGNER_THUMBPRINT }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Require authorized signing configuration before building
        shell: bash
        env:
          CSC_LINK: ${{ secrets.SLED_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SLED_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.SLED_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.SLED_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.SLED_APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.SLED_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.SLED_WIN_CSC_KEY_PASSWORD }}
        run: python3 scripts/sled/hosted-desktop-release.py credentials --platform '${{ matrix.platform }}'
      - name: Ensure Windows Spectre libraries
        if: matrix.platform == 'win'
        uses: ./.github/actions/setup-spectre
      - name: Select the native SDK used by CI
        if: matrix.platform == 'mac'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/monorepo --filter @t3tools/desktop... --filter @t3tools/web... --filter t3... --filter @t3tools/scripts...
          restore-full-store: "false"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve native build cache identity
        id: native-cache
        shell: bash
        run: |
          rustc -vV > "$RUNNER_TEMP/rust-toolchain.txt"
          echo "rust=$(git hash-object "$RUNNER_TEMP/rust-toolchain.txt")" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == macOS ]]; then
            { xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; swift --version; } > "$RUNNER_TEMP/swift-toolchain.txt"
            echo "swift=$(git hash-object "$RUNNER_TEMP/swift-toolchain.txt")" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the exact resource monitor binary
        id: resource-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: sled-resource-monitor-binary-v2-${{ matrix.rust }}-${{ steps.native-cache.outputs.rust }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Cache Mac host compilation
        if: matrix.platform == 'mac'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/remote-desktop/.build
          key: sled-mac-host-v1-${{ runner.arch }}-${{ steps.native-cache.outputs.swift }}-${{ hashFiles('native/remote-desktop/Package.*', 'native/remote-desktop/Sources/**', 'third-party/webrtc/manifest.json') }}
          restore-keys: |
            sled-mac-host-v1-${{ runner.arch }}-${{ steps.native-cache.outputs.swift }}-
      - name: Select Electron download caches
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder" >> "$GITHUB_ENV"
      - name: Cache Electron and packaging tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: sled-electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            sled-electron-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reuse the pinned WebRTC binary from CI
        if: matrix.platform == 'mac'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tools/webrtc/*.zip
          key: webrtc-archive-macos-v1-${{ hashFiles('third-party/webrtc/manifest.json') }}
      - name: Prepare and sign the Mac native host
        if: matrix.platform == 'mac'
        run: |
          python3 scripts/sled/prepare-native.py
          python3 scripts/sled/ci_progress.py run --phase "Build native remote desktop host" -- python3 scripts/build-host.py
      - name: Build desktop
        run: python3 scripts/sled/ci_progress.py run --phase "Build desktop" -- vp run build:desktop
      - name: Build signed final installer and updater metadata
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource-cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.SLED_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SLED_MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.SLED_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.SLED_WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          signing=(--signed)
          if [[ '${{ matrix.platform }}' == 'mac' && "$SLED_MAC_DISTRIBUTION" == 'private-development' ]]; then
            signing=()
          fi
          python3 scripts/sled/ci_progress.py run --phase "Build signed final installer and updater metadata" -- vp run dist:desktop:artifact --platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --arch '${{ matrix.arch }}' --build-version '${{ needs.resolve.outputs.version }}' "${signing[@]}" --skip-build --verbose --output-dir release-desktop
      - name: Finalize private metadata and verify signatures and update assets
        env:
          SLED_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/sled/verify-hosted-desktop.cjs '${{ matrix.platform }}' release-desktop
      - name: Retain uncertified Windows packages for diagnosis only
        if: failure() && matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: sled-diagnostics-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release-desktop/*.exe
            release-desktop/windows-signatures.json
      - uses: actions/upload-artifact@v4
        with:
          name: sled-desktop-${{ matrix.platform }}
          retention-days: 7
          compression-level: 0
          path: release-desktop/*
          if-no-files-found: error
      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-desktop-build-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore
  publish:
    if: ${{ !inputs.verify_only }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sled-desktop-*
          path: release-desktop
          merge-multiple: true
      - name: Publish both certified platforms atomically from a draft
        env:
          GH_TOKEN: ${{ github.token }}
          SLED_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SLED_RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/sled/hosted-desktop-release.py publish
  verify:
    name: Verify release tooling (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    env:
      CI_TIMING_JOB: Verify release tooling (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test progress reporting
        run: python3 scripts/sled/ci_progress_test.py
      - name: Load recent GitHub step timings
        id: timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sled/ci_progress.py history --workflow sled-desktop-release.yml
      - name: Set timing baseline
        env:
          BASELINE: ${{ steps.timing.outputs.timings }}
        run: echo "CI_TIMING_BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Install Linux native build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Ensure Windows Spectre libraries
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-spectre
      - name: Select native SDK
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/monorepo --filter @t3tools/desktop... --filter @t3tools/web... --filter t3... --filter @t3tools/scripts...
          restore-full-store: "false"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop
        run: python3 scripts/sled/ci_progress.py run --phase "Build desktop" -- vp run build:desktop
      - name: Cache pinned WebRTC binary
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: .tools/webrtc/*.zip
          key: webrtc-archive-macos-v1-${{ hashFiles('third-party/webrtc/manifest.json') }}
      - name: Prepare native dependencies
        if: runner.os == 'macOS'
        run: python3 scripts/sled/ci_progress.py run --phase "Prepare native dependencies" -- python3 scripts/sled/prepare-native.py
      - name: Compile native host
        if: runner.os == 'macOS'
        run: python3 scripts/sled/ci_progress.py run --phase "Compile native host" -- python3 scripts/build-host.py
      - name: Verify actual desktop packaging
        if: runner.os != 'Linux'
        run: |
          python3 scripts/sled/ci_progress.py run --phase "Package desktop" -- vp run dist:desktop:artifact --platform '${{ runner.os == 'macOS' && 'mac' || 'win' }}' --target '${{ runner.os == 'macOS' && 'zip' || 'nsis' }}' --arch '${{ runner.os == 'macOS' && 'arm64' || 'x64' }}' --build-version 0.2.999 --skip-build --verbose --output-dir "$RUNNER_TEMP/desktop-verify"
      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-timings-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: error
