name: Sled Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a new candidate or promote a checked candidate
        type: choice
        options: [prepare, finalize]
        default: prepare
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: sled-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'SamoyedLabs/sled-code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Optional repository-scoped App token
        id: app
        if: vars.SLED_UPSTREAM_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SLED_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.SLED_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sled-code
      - name: Check out trusted automation from main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Prepare or promote the candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ACTION: ${{ github.event_name == 'workflow_run' && 'finalize' || inputs.action || 'prepare' }}
        run: python3 scripts/sled/upstream.py "$ACTION"
