name: CI
run-name: CI ${{ inputs.candidate_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to validate
        required: true
        type: string
      base_sha:
        description: Base commit for affected checks (empty runs every job)
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - t3/optimize-ci-runtime

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Automation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.automation != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Test upstream merge and promotion safeguards
        run: python3 scripts/sled/upstream_test.py
      - name: Verify upstream branch read with the workflow token
        if: github.repository == 'SamoyedLabs/sled-code'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/main" |
            jq --exit-status '.protected and (.protection.required_status_checks.contexts | index("Check") != null)'
      - name: Test progress and ETA reporting
        run: python3 scripts/sled/ci_progress_test.py
      - name: Test CI routing
        run: node --test .github/scripts/ci-changes.test.cjs .github/scripts/ci-gate.test.cjs
      - name: Test independent release detection
        run: node --test .github/scripts/sled-release-detector.test.mjs
      - name: Verify pinned native dependency notices
        run: |
          python3 scripts/prepare-webrtc-notices.py
          git diff --exit-code -- third-party/webrtc apps/mobile/modules/t3-remote-desktop/Vendor

  # Skips jobs a pull request cannot affect: a web change does not run the
  # server shards, a server change does not run the mobile tests, and the macOS
  # lint (~6.7x a Linux minute) runs only for native mobile sources.
  # .github/scripts/ci-changes.cjs maps changed files to workspace packages and
  # their dependents, on both PRs and main. Detection fails open: if the diff
  # cannot be resolved or a path has no known owner, everything runs.

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      timings: ${{ steps.timing.outputs.timings }}
      docs: ${{ steps.detect.outputs.docs }}
      docs_files: ${{ steps.detect.outputs.docs_files }}
      lint: ${{ steps.detect.outputs.lint }}
      automation: ${{ steps.detect.outputs.automation }}
      typecheck: ${{ steps.detect.outputs.typecheck }}
      build: ${{ steps.detect.outputs.build }}
      desktop_launch: ${{ steps.detect.outputs.desktop_launch }}
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_web: ${{ steps.detect.outputs.test_web }}
      test_lint_rules: ${{ steps.detect.outputs.test_lint_rules }}
      test_scripts: ${{ steps.detect.outputs.test_scripts }}
      test_mobile: ${{ steps.detect.outputs.test_mobile }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
      release_smoke: ${{ steps.detect.outputs.release_smoke }}
      remote_native: ${{ steps.detect.outputs.remote_native }}
      mobile_native: ${{ steps.detect.outputs.mobile_native }}
    steps:
      # Only the package manifests the script reads to build the dependency graph.
      # Depth 2 brings the base commit the change is diffed against.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /.gitmodules
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /scripts/sled/ci_progress.py
            /config/sled-upstream.json
            /*/package.json
            /*/*/package.json
            !/.repos/
            !/vendor/
          sparse-checkout-cone-mode: false

      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          if [[ -n "$BASE_SHA" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          fi

      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes
        with:
          base-sha: ${{ inputs.base_sha }}

      - name: Load recent GitHub step timings
        id: timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sled/ci_progress.py history --workflow ci.yml

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /.gitmodules
            /package.json
            /*.md
            /docs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Check documentation formatting without installing the application
        env:
          DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          files = [path for path in json.loads(os.environ["DOCS_FILES"]) if pathlib.Path(path).is_file()]
          if files:
              subprocess.run(["npx", "--yes", "--package=oxfmt@0.74.0", "oxfmt", "--check", "--disable-nested-config", "--", *files], check=True)
          else:
              print("Only documentation assets or deletions changed; no Markdown to format.")
          PYTHON

  # Lint and the desktop build each get a runner so they run side by side.
  # Typecheck shares the build's install. Lint always runs: it formats every
  # application file. Docs-only edits use the lightweight formatter job. `Check` passes only
  # when every other job passes or was skipped by `changes`.
  lint:
    permissions:
      contents: read
      actions: read
    name: Lint
    needs: changes
    env:
      CI_TIMING_JOB: Lint
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.lint != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Check unused code" -- vp run knip:check

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Check
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Check" -- vp check

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  build:
    permissions:
      contents: read
      actions: read
    name: Build and Typecheck
    needs: changes
    env:
      CI_TIMING_JOB: Build and Typecheck
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && (needs.changes.outputs.build != 'false' || needs.changes.outputs.typecheck != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Runs in the background while Vite+ installs; the step before the build waits for it.
      # Xvfb is for the desktop launch check below.
      - name: Start installing browser secret helper build libraries
        if: needs.changes.outputs.build != 'false'
        run: |
          # Fetch only the indexes these main and universe packages need. The full set is ~42 MB,
          # which a slow mirror can stretch past the wait below.
          for sources in /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]]; then
              sudo sed -i -e 's|http://|https://|g' -e 's/^Components: .*/Components: main universe/' "$sources"
            fi
          done
          (
            set +e
            sudo apt-get update -o Acquire::Languages=none \
              -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
              sudo apt-get install -y libsecret-1-dev pkg-config xvfb
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        id: electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # Runs in the background while the build runs, and reports in the last
      # step: neither result hides the other.
      - name: Start typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && needs.changes.outputs.typecheck != 'false' }}
        run: |
          (
            set +e
            vpr typecheck
            echo "$?" > "$RUNNER_TEMP/typecheck-status"
          ) > "$RUNNER_TEMP/typecheck.log" 2>&1 < /dev/null &

      - name: Finish installing browser secret helper build libraries
        id: apt
        if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Build desktop pipeline
        id: build
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.apt.outcome == 'success' && needs.changes.outputs.build != 'false' }}
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Build desktop pipeline" -- vp run build:desktop

      - name: Verify preload bundle output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      # The release launch check, run unpackaged against the same old-state fixture, for
      # startup and sidebar changes. Packaging and signing stay release-only.
      - name: Open the seeded thread in the built desktop app
        id: desktop_launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.desktop_launch != 'false' }}
        timeout-minutes: 4
        run: |
          electron=$(node -p "require('./apps/desktop/node_modules/electron')")
          xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$electron" --app apps/desktop \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload desktop launch check
        if: ${{ failure() && steps.desktop_launch.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      # Browser tests run source modules; this boots the production chunk graph. The
      # desktop build above already produced apps/web/dist, and the client waits about
      # 15s for a session that never comes, so this runs here instead of in Test Web,
      # which gates the whole run. Chromium comes from the cache Test Web shares.
      - name: Resolve Playwright version
        id: playwright_version
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for the built web client boot check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' && steps.chromium_cache.outputs.cache-hit != 'true' }}
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Boot the built web client
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        timeout-minutes: 3
        run: node apps/web/scripts/verify-built-boot.ts

      - name: Typecheck
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/typecheck-status"; do sleep 1; done
          cat "$RUNNER_TEMP/typecheck.log"
          exit "$(cat "$RUNNER_TEMP/typecheck-status")"

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Server, web, mobile and scripts have independent jobs below.
  # `--parallel` drops the package dependency ordering that `vp run`
  # applies by default: these `test` tasks declare no `dependsOn` and resolve
  # workspace deps from source, so ordering only bought us idle runners between
  # dependency layers. The concurrency limit stays at the default 4 so peak load
  # per runner is unchanged.
  test:
    permissions:
      contents: read
      actions: read
    name: Test
    needs: changes
    env:
      CI_TIMING_JOB: Test
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # The desktop tests compile the browser secret helper. The install runs in
      # the background while Vite+ installs; the step before the tests waits for it.
      - name: Start installing browser secret helper build libraries
        run: |
          # Fetch only the indexes these main and universe packages need. The full set is ~42 MB,
          # which a slow mirror can stretch past the wait below.
          for sources in /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]]; then
              sudo sed -i -e 's|http://|https://|g' -e 's/^Components: .*/Components: main universe/' "$sources"
            fi
          done
          (
            set +e
            sudo apt-get update -o Acquire::Languages=none \
              -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
              sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs .github/scripts/mobile-preview-comment.test.cjs .github/scripts/test-delta.test.cjs

      - name: Finish installing browser secret helper build libraries
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      # `changes` lists the affected packages, or nothing when all of them are.
      - name: Test
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          set -o pipefail
          filters=(--filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' --filter '!@t3tools/mobile' --filter '!@t3tools/scripts' --filter '!@t3tools/oxlint-plugin-t3code')
          if [[ -n "$TEST_PACKAGES" ]]; then
            filters=()
            for package in $TEST_PACKAGES; do filters+=(--filter "$package"); done
          fi
          # The runner's trace writer can crash on surrogate pairs in test output.
          python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp run --parallel --concurrency-limit 4 "${filters[@]}" test 2>&1 | python3 -u -c '
          import sys
          for line in sys.stdin:
              sys.stdout.write(line.encode("ascii", "backslashreplace").decode("ascii"))
          '

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  test_scripts:
    permissions:
      contents: read
      actions: read
    name: Test Scripts
    needs: changes
    env:
      CI_TIMING_JOB: Test Scripts
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_scripts != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs

      - name: Test
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp run --filter @t3tools/scripts test

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  test_lint_rules:
    permissions:
      contents: read
      actions: read
    name: Test Lint Rules
    needs: changes
    env:
      CI_TIMING_JOB: Test Lint Rules
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_lint_rules != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Test
        id: tests
        working-directory: oxlint-plugin-t3code
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp test run --config ../vite.config.ts --dir . --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-lint-rules
          path: ${{ runner.temp }}/test-results.json
          retention-days: 7
          if-no-files-found: error

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  test_web:
    name: Test Web ${{ matrix.project }} ${{ matrix.shard }}/2
    needs: changes
    env:
      CI_TIMING_JOB: Test Web ${{ matrix.project }} ${{ matrix.shard }}/2
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_web != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [unit, browser]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        if: matrix.project == 'browser'
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: matrix.project == 'browser'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: matrix.project == 'browser' && steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: matrix.project == 'browser'
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        id: tests
        working-directory: apps/web
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp test run --project ${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-web-${{ matrix.shard }}-${{ matrix.project }}
          path: ${{ runner.temp }}/test-results.json
          retention-days: 7
          if-no-files-found: error

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  test_web_boot:
    name: Web Production Boot
    needs: changes
    env:
      CI_TIMING_JOB: Web Production Boot
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_web != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Boot the built web client
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Boot the built web client" -- vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  test_mobile:
    name: Test Mobile ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: changes
    env:
      CI_TIMING_JOB: Test Mobile ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_mobile != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: unit, shard: 1, total: 1 }
          - { project: react, shard: 1, total: 2 }
          - { project: react, shard: 2, total: 2 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        id: dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Test
        id: tests
        working-directory: apps/mobile
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp test run --project ${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-mobile-${{ matrix.shard }}-${{ matrix.project }}
          path: ${{ runner.temp }}/test-results.json
          retention-days: 7
          if-no-files-found: error

      - name: Test compiler coverage
        if: ${{ !cancelled() && matrix.project == 'react' && steps.dependencies.outcome == 'success' }}
        id: compiler
        working-directory: apps/mobile
        env:
          T3_MOBILE_COMPILER_SHARD: ${{ matrix.shard }}/2
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test compiler coverage" -- vp test run --project compiler --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Upload compiler timings
        if: always() && matrix.project == 'react' && steps.compiler.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-compiler-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results.json
          retention-days: 7
          if-no-files-found: error

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly. One file at a time keeps
  # about 1.5 cores busy, so 4 vCPU runners lose nothing against 8. The shards
  # split files by recorded duration (apps/server/src/testUtils/weightedShardSequencer.ts).
  # Gate before expanding the matrix so docs-only edits start no server runners.
  test_server:
    permissions:
      contents: read
      actions: read
    name: Test Server ${{ matrix.shard }}
    needs: changes
    env:
      CI_TIMING_JOB: Test Server ${{ matrix.shard }}
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.test_server != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Depth 2 brings the base commit the change is diffed against.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.changes.outputs.test_server != 'false'
        uses: ./.github/actions/setup-ci-deps

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      # Cache the pinned browser and skip apt unless shared libraries are missing.
      - name: Resolve Playwright version
        id: playwright_version
        if: needs.changes.outputs.test_server != 'false'
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: needs.changes.outputs.test_server != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: needs.changes.outputs.test_server != 'false' && steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: needs.changes.outputs.test_server != 'false'
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test
        id: tests
        if: needs.changes.outputs.test_server != 'false'
        working-directory: apps/server
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          T3CODE_TRANSFER_BUDGET_SCENARIOS_PATH: ${{ runner.temp }}/thread-transfer-scenarios.json
        # Remote task caching is disabled; one invocation avoids a cold task runner per file.
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Test" -- vp test run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-server-${{ matrix.shard }}
          retention-days: 7
          path: ${{ runner.temp }}/test-results.json
          if-no-files-found: error

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thread-transfer-results
          path: |
            ${{ runner.temp }}/thread-transfer-result.json
            ${{ runner.temp }}/thread-transfer-scenarios.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: changes
    env:
      CI_TIMING_JOB: Mobile Native Static Analysis
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.mobile_native != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
          restore-full-store: "false"

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Lint mobile native sources" -- vp run lint:mobile

      - name: Parse remote desktop Swift sources against the iOS Simulator SDK
        run: |
          mapfile_compat() { while IFS= read -r line; do sources+=("$line"); done; }
          sources=()
          mapfile_compat < <(find apps/mobile/modules/t3-remote-desktop/ios apps/mobile/modules/t3-remote-desktop/Vendor -name '*.swift' -type f)
          test "${#sources[@]}" -gt 0
          xcrun swiftc -frontend -parse -target arm64-apple-ios18.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" "${sources[@]}"

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  remote_native:
    name: Remote Desktop Host Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.remote_native != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_TIMING_JOB: Remote Desktop Host Build
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
      # SecIdentityCreate is public in the macOS 26 SDK; the runner defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned WebRTC binary
        uses: actions/cache@v6
        with:
          path: .tools/webrtc/*.zip
          key: webrtc-archive-macos-v1-${{ hashFiles('third-party/webrtc/manifest.json') }}
      - name: Prepare pinned native dependencies
        run: python3 scripts/sled/prepare-native.py
      - name: Report native build toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Compile macOS capture, encoding, transport and input host
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Compile macOS capture, encoding, transport and input host" -- swift build --package-path native/remote-desktop --product T3RemoteHost -c debug

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  release_smoke:
    permissions:
      contents: read
      actions: read
    name: Release Smoke
    needs: changes
    env:
      CI_TIMING_JOB: Release Smoke
      CI_TIMING_BASELINE: ${{ needs.changes.outputs.timings }}
    if: ${{ !cancelled() && needs.changes.outputs.release_smoke != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/vendor/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Exercise release-only workflow steps
        run: python3 "$GITHUB_WORKSPACE/scripts/sled/ci_progress.py" run --phase "Exercise release-only workflow steps" -- node scripts/release-smoke.ts

      - name: Retain phase timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Branch protection requires this job by its name, `Check`. It fails when any
  # other job fails, is cancelled, or is skipped without a reason, so splitting
  # or resharding jobs needs no ruleset change. Add every new job to `needs`.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing check.
  check:
    name: Check
    if: ${{ always() }}
    needs:
      [
        automation,
        changes,
        docs,
        lint,
        build,
        test,
        test_web,
        test_web_boot,
        test_scripts,
        test_lint_rules,
        test_mobile,
        test_server,
        rust,
        mobile_native_static_analysis,
        remote_native,
        release_smoke,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A job may skip only when `changes` said every gate it represents was
          # not needed. Gates are keyed by job name, except merged Build and the
          # macOS lint.
          echo "$RESULTS" | jq -e '.changes.outputs as $gates
            | {build: ["build", "typecheck", "desktop_launch"], mobile_native_static_analysis: ["mobile_native"], test_web_boot: ["test_web"]} as $renamed
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped"
                  and (($renamed[.key] // [.key]) | all(.[]; $gates[.] == "false"))))' > /dev/null

      # thread-transfer-report.yml reads this artifact after CI, so a run whose
      # server tests ran must have produced it.
      - name: Require transfer measurements
        if: needs.test_server.result == 'success' && needs.changes.outputs.test_server != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer
